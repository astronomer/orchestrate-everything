[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmarket-duckdb"
version = "0.1.0"
description = "Minimal Airflow provider registering a DuckDB DbApiHook, so SQLToolset can reach a local DuckDB file."
requires-python = ">=3.10"

[project.entry-points."apache_airflow_provider"]
provider_info = "cosmarket_duckdb:get_provider_info"

[tool.setuptools]
packages = ["cosmarket_duckdb"]
